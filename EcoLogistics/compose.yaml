services:
  postgres:
    image: postgis/postgis:16-3.4
    container_name: eco_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ecologistics
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      PGDATA: /var/lib/postgresql/data/pgdata
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d ecologistics"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - ecologistics-net

  rabbitmq:
    image: rabbitmq:3.13-management
    container_name: eco_rabbitmq
    restart: unless-stopped
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    networks:
      - ecologistics-net

  redis:
    image: redis:7-alpine
    container_name: eco_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    networks:
      - ecologistics-net

  seq:
    image: datalust/seq:latest
    container_name: eco_seq
    environment:
      - ACCEPT_EULA=Y
      - SEQ_FIRSTRUN_ADMINPASSWORDHASH=QKZJaq4AeQqrk/DVp7sYkxd5z44bpQzmfy0e2tDGwlneOBPbWH6ckU+Gm3J9mCcF2JB2uNSI+MYfA3E5WFvIJToxPSi6tExEP1KAjx7uMzsr
    ports:
      - "5341:80"
    volumes:
      - seq-data:/data
    restart: unless-stopped
    networks:
      - ecologistics-net

  ecologistics_api:
    depends_on:
      - postgres
      - rabbitmq
      - redis
      - seq
    image: ecologistics.api
    build:
      context: .
      dockerfile: src/host/Ecologistics.Host/Dockerfile
    ports:
      - "80:80"
      - "443:443"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
    volumes:
      - api-data:/data
    restart: unless-stopped
    networks:
      - ecologistics-net

volumes:
  pgdata:
  rabbitmq_data:
  redis_data:
  seq-data:
  api-data:

networks:
  ecologistics-net:
    driver: bridge

