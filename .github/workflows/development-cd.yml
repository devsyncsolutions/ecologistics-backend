name: Development CD Pipeline

on:
  workflow_dispatch:
    inputs:
      image-tag:
        description: "Docker image tag to deploy (paste the full commit SHA from the CI run)"
        required: true
        default: "latest"

concurrency:
  group: deploy-qa
  cancel-in-progress: false

env:
  DOTNET_VERSION: "10.0.x"
  DOCKER_IMAGE: ${{ secrets.DOCKER_USERNAME }}/ecologistics-be
  CONTAINER_NAME: ecologistics-be-qa

jobs:
  deploy-qa:
    name: Deploy to QA (Manual Trigger)
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Log in to Docker registry
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Verify image tag exists in registry
        env:
          IMAGE_TAG: ${{ inputs['image-tag'] }}
        run: |
          IMAGE_REF="${{ env.DOCKER_IMAGE }}:${IMAGE_TAG}"
          echo "Checking if $IMAGE_REF exists in registry..."
          if ! docker manifest inspect "$IMAGE_REF" > /dev/null 2>&1; then
            echo "❌ Image $IMAGE_REF not found. Ensure CI completed for this commit SHA."
            exit 1
          fi
          echo "✅ Image $IMAGE_REF confirmed in registry"

      - name: Deploy to CloudClusters QA Servers
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.QA_SERVER_HOST }}
          username: ${{ secrets.QA_SERVER_USER }}
          password: ${{ secrets.QA_SERVER_PASSWORD }}
          port: ${{ secrets.QA_SERVER_PORT }}
          script: |
            set -euo pipefail

            IMAGE_TAG="${{ inputs['image-tag'] }}"
            IMAGE_REF="${{ env.DOCKER_IMAGE }}:${IMAGE_TAG}"
            CONTAINER_NAME="${{ env.CONTAINER_NAME }}"
            FIREBASE_CREDS_PATH="/tmp/${CONTAINER_NAME}-firebase-creds.json"
            PREVIOUS_IMAGE_ID=""

            if docker ps -a --format '{{.Names}}' | grep -q "^${CONTAINER_NAME}$"; then
              PREVIOUS_IMAGE_ID=$(docker inspect --format='{{.Image}}' "$CONTAINER_NAME" 2>/dev/null || echo "")
            fi

            echo "Preflight checks: verifying Docker and port availability..."
            docker --version
            command -v lsof >/dev/null 2>&1 || true

            echo "Pulling $IMAGE_REF on server..."
            docker pull "$IMAGE_REF"
            EXPECTED_IMAGE_ID=$(docker inspect --format='{{.Id}}' "$IMAGE_REF")
            echo "Expected image ID: $EXPECTED_IMAGE_ID"

            echo "Checking for processes using port 8080..."
            PORT_8080_PID=$(lsof -ti:8080 2>/dev/null || echo "")
            if [ -n "$PORT_8080_PID" ]; then
              echo "Found process(es) using port 8080: $PORT_8080_PID"
              kill -9 "$PORT_8080_PID" 2>/dev/null || true
              sleep 2
            fi

            echo "Stopping existing container..."
            docker stop "$CONTAINER_NAME" || true
            docker rm "$CONTAINER_NAME" || true

            echo "Checking for other containers using port 8080..."
            CONFLICTING_CONTAINERS=$(docker ps -a --filter "publish=8080" --format "{{.Names}}" 2>/dev/null || echo "")
            if [ -n "$CONFLICTING_CONTAINERS" ]; then
              echo "Found containers using port 8080: $CONFLICTING_CONTAINERS"
              for container in $CONFLICTING_CONTAINERS; do
                echo "Stopping and removing container: $container"
                docker stop "$container" || true
                docker rm "$container" || true
              done
            fi

            sleep 3

            echo "Writing Firebase credentials to temp file..."
            umask 022
            echo "${{ secrets.QA_FIREBASE_CREDENTIALS }}" | base64 -d > "$FIREBASE_CREDS_PATH"
            chmod 644 "$FIREBASE_CREDS_PATH"

            if ! (command -v jq >/dev/null 2>&1 && jq . "$FIREBASE_CREDS_PATH" > /dev/null 2>&1) \
               && ! (command -v python3 >/dev/null 2>&1 && python3 -m json.tool < "$FIREBASE_CREDS_PATH" > /dev/null 2>&1); then
              echo "❌ Decoded Firebase credentials are not valid JSON. Aborting."
              rm -f "$FIREBASE_CREDS_PATH"
              exit 1
            fi
            echo "✅ Firebase credentials file decoded and validated"

            echo "Starting new container from $IMAGE_REF..."
            if ! docker run -d \
              --name "$CONTAINER_NAME" \
              --restart unless-stopped \
              --pull always \
              --network ecologistics-net \
              -p 8080:8080 \
              -v "${FIREBASE_CREDS_PATH}:/app/firebase-creds.json:ro" \
              -e ASPNETCORE_ENVIRONMENT=Staging \
              -e "ConnectionStrings__DefaultConnection=${{ secrets.QA_DB_CONNECTION_STRING }}" \
              -e "ConnectionStrings__RedisConnection=${{ secrets.QA_REDIS_CONNECTION_STRING }}" \
              -e "ConnectionStrings__RabbitMQConnection=${{ secrets.QA_RABBITMQ_CONNECTION_STRING }}" \
              -e "Sentry__Dsn=${{ secrets.QA_SENTRY_DSN }}" \
              -e "OpenTelemetry__OtelEndpoint=http://ecologistics-seq:5341/ingest/otlp" \
              -e "Arkessel__ApiKey=${{ secrets.QA_ARKESSEL_APIKEY }}" \
              -e "Arkessel__BaseUrl=${{ secrets.QA_ARKESSEL_BASEURL }}" \
              -e "Arkessel__SenderId=${{ secrets.QA_ARKESSEL_SENDERID }}" \
              -e "JwtSettings__Key=${{ secrets.QA_JWTSETTINGS_KEY }}" \
              -e "JwtSettings__Issuer=${{ secrets.QA_JWTSETTINGS_ISSUER }}" \
              -e "JwtSettings__Audience=${{ secrets.QA_JWTSETTINGS_AUDIENCE }}" \
              -e "JwtSettings__AccessTokenExpirationMinutes=${{ secrets.QA_JWTSETTINGS_ACCESSTOKENEXPIRATIONMINUTES }}" \
              -e "JwtSettings__RefreshTokenExpirationDays=${{ secrets.QA_JWTSETTINGS_REFRESHTOKENEXPIRATIONDAYS }}" \
              -e "TickerQ__Dashboard__Username=${{ secrets.QA_TICKERQ_DASHBOARD_USERNAME }}" \
              -e "TickerQ__Dashboard__Password=${{ secrets.QA_TICKERQ_DASHBOARD_PASSWORD }}" \
              -e "Cloudinary__CloudName=${{ secrets.QA_CLOUDINARY_CLOUDNAME }}" \
              -e "Cloudinary__ApiKey=${{ secrets.QA_CLOUDINARY_APIKEY }}" \
              -e "Cloudinary__ApiSecret=${{ secrets.QA_CLOUDINARY_APISECRET }}" \
              -e "Cors__AllowedOrigins=${{ secrets.QA_CORS_ALLOWEDORIGINS }}" \
              -e "Firebase__CredentialsPath=/app/firebase-creds.json" \
              "$IMAGE_REF"; then
              echo "❌ Failed to start container. Rolling back..."
              rm -f "$FIREBASE_CREDS_PATH"
              if [ -n "$PREVIOUS_IMAGE_ID" ]; then
                docker rm -f "$CONTAINER_NAME" 2>/dev/null || true
                echo "Previous image was $PREVIOUS_IMAGE_ID"
              fi
              exit 1
            fi

            echo "Verifying deployment..."
            sleep 5
            if docker ps | grep -q "$CONTAINER_NAME"; then
              RUNNING_IMAGE_ID=$(docker inspect --format='{{.Image}}' "$CONTAINER_NAME" 2>/dev/null || echo "")
              if [ "$RUNNING_IMAGE_ID" = "$EXPECTED_IMAGE_ID" ]; then
                echo "✅ Container $CONTAINER_NAME is running with verified image $IMAGE_REF"
              else
                echo "❌ Image digest mismatch! Expected: $EXPECTED_IMAGE_ID, Got: $RUNNING_IMAGE_ID"
                echo "Rolling back to previous container state..."
                docker rm -f "$CONTAINER_NAME" 2>/dev/null || true
                if [ -n "$PREVIOUS_IMAGE_ID" ]; then
                  echo "Previous image was $PREVIOUS_IMAGE_ID"
                fi
                exit 1
              fi
            else
              echo "❌ Container $CONTAINER_NAME failed to start"
              echo "----- Exit reason -----"
              docker inspect --format='ExitCode: {{.State.ExitCode}} | Error: {{.State.Error}} | OOMKilled: {{.State.OOMKilled}}' "$CONTAINER_NAME" 2>/dev/null || echo "Could not inspect container state"
              echo "----- Container logs (full) -----"
              docker logs "$CONTAINER_NAME" 2>&1 || echo "No logs available"
              echo "----------------------------------"
              echo "Rolling back to previous container state..."
              docker rm -f "$CONTAINER_NAME" 2>/dev/null || true
              if [ -n "$PREVIOUS_IMAGE_ID" ]; then
                echo "Previous image was $PREVIOUS_IMAGE_ID"
              fi
              exit 1
            fi
