name: Production CD Pipeline

on:
    workflow_dispatch:
        inputs:
            image-tag:
                description: "Docker image tag to deploy (paste the full commit SHA from the CI run)"
                required: true
                default: "latest"

concurrency:
    group: deploy-production
    cancel-in-progress: false

env:
    DOCKER_IMAGE: ${{ secrets.DOCKER_USERNAME }}/ecologistics-be
    CONTAINER_NAME: ecologistics-be-prod

jobs:
    deploy-production:
        name: Deploy to Production (Manual Trigger)
        runs-on: ubuntu-latest
        environment: production
        steps:
            - name: Checkout code
              uses: actions/checkout@v4

            - name: Log in to Docker registry
              uses: docker/login-action@v3
              with:
                  username: ${{ secrets.DOCKER_USERNAME }}
                  password: ${{ secrets.DOCKER_PASSWORD }}

            - name: Verify image tag exists in registry
              env:
                  IMAGE_TAG: ${{ inputs['image-tag'] }}
              run: |
                  IMAGE_REF="${{ env.DOCKER_IMAGE }}:${IMAGE_TAG}"
                  echo "Checking if $IMAGE_REF exists in registry..."
                  if ! docker manifest inspect "$IMAGE_REF" > /dev/null 2>&1; then
                    echo "❌ Image $IMAGE_REF not found. Ensure CI completed for this commit SHA."
                    exit 1
                  fi
                  echo "✅ Image $IMAGE_REF confirmed in registry"

            - name: Deploy to Production Server
              uses: appleboy/ssh-action@v1
              with:
                  host: ${{ secrets.PROD_SERVER_HOST }}
                  username: ${{ secrets.PROD_SERVER_USER }}
                  password: ${{ secrets.PROD_SERVER_PASSWORD }}
                  port: ${{ secrets.PROD_SERVER_PORT }}
                  script: |
                      set -euo pipefail

                      IMAGE_TAG="${{ inputs['image-tag'] }}"
                      IMAGE_REF="${{ env.DOCKER_IMAGE }}:${IMAGE_TAG}"
                      CONTAINER_NAME="${{ env.CONTAINER_NAME }}"
                      PREVIOUS_IMAGE_ID=""

                      if docker ps -a --format '{{.Names}}' | grep -q "^${CONTAINER_NAME}$"; then
                        PREVIOUS_IMAGE_ID=$(docker inspect --format='{{.Image}}' "$CONTAINER_NAME" 2>/dev/null || echo "")
                      fi

                      echo "Preflight checks: verifying Docker and port availability..."
                      docker --version
                      command -v lsof >/dev/null 2>&1 || true

                      echo "Pulling $IMAGE_REF on server..."
                      docker pull "$IMAGE_REF"
                      EXPECTED_IMAGE_ID=$(docker inspect --format='{{.Id}}' "$IMAGE_REF")
                      echo "Expected image ID: $EXPECTED_IMAGE_ID"

                      echo "Checking for processes using port 8080..."
                      PORT_8080_PID=$(lsof -ti:8080 2>/dev/null || echo "")
                      if [ -n "$PORT_8080_PID" ]; then
                        echo "Found process(es) using port 8080: $PORT_8080_PID"
                        kill -9 "$PORT_8080_PID" 2>/dev/null || true
                        sleep 2
                      fi

                      echo "Stopping existing container..."
                      docker stop "$CONTAINER_NAME" || true
                      docker rm "$CONTAINER_NAME" || true

                      echo "Checking for other containers using port 8080..."
                      CONFLICTING_CONTAINERS=$(docker ps -a --filter "publish=8080" --format "{{.Names}}" 2>/dev/null || echo "")
                      if [ -n "$CONFLICTING_CONTAINERS" ]; then
                        echo "Found containers using port 8080: $CONFLICTING_CONTAINERS"
                        for container in $CONFLICTING_CONTAINERS; do
                          echo "Stopping and removing container: $container"
                          docker stop "$container" || true
                          docker rm "$container" || true
                        done
                      fi

                      sleep 3

                      echo "Starting new container from $IMAGE_REF..."
                      if ! docker run -d \
                        --name "$CONTAINER_NAME" \
                        --restart unless-stopped \
                        --pull always \
                        -p 8080:8080 \
                        -e ASPNETCORE_ENVIRONMENT=Production \
                        -e "ConnectionStrings__DefaultConnection=${{ secrets.PROD_DB_CONNECTION_STRING }}" \
                        -e "ConnectionStrings__RedisConnection=${{ secrets.PROD_REDIS_CONNECTION_STRING }}" \
                        -e "ConnectionStrings__RabbitMQConnection=${{ secrets.PROD_RABBITMQ_CONNECTION_STRING }}" \
                        -e "Sentry__Dsn=${{ secrets.PROD_SENTRY_DSN }}" \
                        -e "Arkessel__ApiKey=${{ secrets.PROD_ARKESSEL_API_KEY }}" \
                        -e "Arkessel__BaseUrl=${{ secrets.PROD_ARKESSEL_BASE_URL }}" \
                        -e "Arkessel__Sender=${{ secrets.PROD_ARKESSEL_SENDER }}" \
                        -e "Resend__ApiKey=${{ secrets.PROD_RESEND_API_KEY }}" \
                        -e "JwtSettings__Key=${{ secrets.PROD_JwtSettings_Key }}" \
                        -e "JwtSettings__Issuer=${{ secrets.PROD_JwtSettings_Issuer }}" \
                        -e "JwtSettings__Audience=${{ secrets.PROD_JwtSettings_Audience }}" \
                        -e "JwtSettings__AccessTokenExpirationMinutes=${{ secrets.PROD_JwtSettings_AccessTokenExpirationMinutes }}" \
                        -e "JwtSettings__RefreshTokenExpirationDays=${{ secrets.PROD_JwtSettings_RefreshTokenExpirationDays }}" \
                        "$IMAGE_REF"; then
                        echo "❌ Failed to start container. Rolling back..."
                        if [ -n "$PREVIOUS_IMAGE_ID" ]; then
                          docker rm -f "$CONTAINER_NAME" 2>/dev/null || true
                          echo "Previous image was $PREVIOUS_IMAGE_ID"
                        fi
                        exit 1
                      fi

                      echo "Verifying deployment..."
                      sleep 5
                      if docker ps | grep -q "$CONTAINER_NAME"; then
                        RUNNING_IMAGE_ID=$(docker inspect --format='{{.Image}}' "$CONTAINER_NAME" 2>/dev/null || echo "")
                        if [ "$RUNNING_IMAGE_ID" = "$EXPECTED_IMAGE_ID" ]; then
                          echo "✅ Container $CONTAINER_NAME is running with verified image $IMAGE_REF"
                        else
                          echo "❌ Image digest mismatch! Expected: $EXPECTED_IMAGE_ID, Got: $RUNNING_IMAGE_ID"
                          echo "Rolling back to previous container state..."
                          docker rm -f "$CONTAINER_NAME" 2>/dev/null || true
                          if [ -n "$PREVIOUS_IMAGE_ID" ]; then
                            echo "Previous image was $PREVIOUS_IMAGE_ID"
                          fi
                          exit 1
                        fi
                      else
                        echo "❌ Container $CONTAINER_NAME failed to start"
                        docker logs "$CONTAINER_NAME" 2>/dev/null || echo "No logs available"
                        echo "Rolling back to previous container state..."
                        docker rm -f "$CONTAINER_NAME" 2>/dev/null || true
                        if [ -n "$PREVIOUS_IMAGE_ID" ]; then
                          echo "Previous image was $PREVIOUS_IMAGE_ID"
                        fi
                        exit 1
                      fi
