name: Configure seq once

on:
    workflow_dispatch:
        inputs:
            image-tag:
                description: "Set up seq for open telemetry once"
                required: true
                default: "latest"

jobs:
    deploy-seq:
        name: Deploy seq (Manual Trigger)
        runs-on: ubuntu-latest
        environment: staging
        steps:
            - name: Checkout code
              uses: actions/checkout@v4

            - name: Log in to Docker registry
              uses: docker/login-action@v3
              with:
                  username: ${{ secrets.DOCKER_USERNAME }}
                  password: ${{ secrets.DOCKER_PASSWORD }}

            - name: Deploy seq to CloudClusters QA Servers
              uses: appleboy/ssh-action@v1
              with:
                  host: ${{ secrets.QA_SERVER_HOST }}
                  username: ${{ secrets.QA_SERVER_USER }}
                  password: ${{ secrets.QA_SERVER_PASSWORD }}
                  port: ${{ secrets.QA_SERVER_PORT }}
                  script: |
                      set -euo pipefail

                      # Create a shared network so containers can resolve each other by name
                      docker network create ecologistics-net 2>/dev/null || echo "Network already exists, continuing..."

                      # Only create Seq if it isn't already running
                      if ! docker ps -a --format '{{.Names}}' | grep -q "^ecologistics-seq$"; then
                      docker run -d \
                          --name ecologistics-seq \
                          --restart unless-stopped \
                          --network ecologistics-net \
                          -e ACCEPT_EULA=Y \
                          -e SEQ_FIRSTRUN_ADMINPASSWORDHASH=${{ secrets.QA_SEQ_ADMIN_PASS }}
                          -p 5341:5341 \
                          -v seq-data:/data \
                          datalust/seq:latest
                      echo "✅ Seq container started"
                      else
                      echo "Seq already running, skipping"
                      fi
