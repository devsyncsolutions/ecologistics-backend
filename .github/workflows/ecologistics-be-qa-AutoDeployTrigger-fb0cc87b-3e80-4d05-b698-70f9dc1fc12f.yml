name: Trigger auto deployment for ecologistics-be-qa

# When this action will be executed
on:
  # Automatically trigger it when detected changes in repo
  push:
    branches: 
      [ develoment ]
    paths:
    - '**'
    - '.github/workflows/ecologistics-be-qa-AutoDeployTrigger-fb0cc87b-3e80-4d05-b698-70f9dc1fc12f.yml'

  # Allow manual trigger 
  workflow_dispatch:
      
jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout to the branch
        uses: actions/checkout@v2

      - name: Azure Login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.ECOLOGISTICSBEQA_AZURE_CREDENTIALS }}

      - name: Build and push container image to registry
        uses: azure/container-apps-deploy-action@v2
        with:
          appSourcePath: ${{ github.workspace }}
          _dockerfilePathKey_: _dockerfilePath_
          _targetLabelKey_: _targetLabel_
          registryUrl: docker.io
          registryUsername: ${{ secrets.ECOLOGISTICSBEQA_REGISTRY_USERNAME }}
          registryPassword: ${{ secrets.ECOLOGISTICSBEQA_REGISTRY_PASSWORD }}
          containerAppName: ecologistics-be-qa
          resourceGroup: DefaultResourceGroup-SUK
          imageToBuild: devsyncinc/devsyncinc/ecologistics-be:${{ github.sha }}
          
            

     

